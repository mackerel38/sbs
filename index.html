<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyBlock Stats</title>
<style>
body { max-width: 900px; margin: 0 auto; padding: 16px; font-family: system-ui, sans-serif; }
pre { overflow-x: auto; background: #f4f4f4; padding: 12px; }
</style>
</head>
<body>
<h1>SkyBlock Stats</h1>
<pre id="stats">読み込み中...</pre>
<script>
fetch("data/stats.json", { cache: "no-store" })
  .then((response) => {
    if (!response.ok) throw new Error();
    return response.json();
  })
  .then((data) => {
    document.getElementById("stats").textContent = JSON.stringify(data, null, 2);
  })
  .catch(() => {
    document.getElementById("stats").textContent = "データがまだありません。Actions を実行してください。";
  });
</script>
</body>
</html>
