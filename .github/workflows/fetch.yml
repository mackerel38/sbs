name: Fetch SkyBlock stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stats
        env:
          HYPIXEL_API_KEY: ${{ secrets.HYPIXEL_API_KEY }}
          MINECRAFT_UUID: 67e1b8b194d247069bcdb7e5d88c0402
          PROFILE_NAME: Kiwi
        run: python scripts/fetch_stats.py
      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || git commit -m "Update SkyBlock stats"
          git push
